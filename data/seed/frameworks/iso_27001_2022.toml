[framework]
id = "ISO-27001-2022"
name = "ISO/IEC 27001:2022"
version = "2022"
region = "global"
authority = "ISO/IEC"

# Testing-relevant Annex A controls

[[controls]]
id = "ISO-A.5.2"
title = "Information security roles and responsibilities"
family = "Organisational Controls"
severity = "Moderate"
description = "Defined and allocated information security roles and responsibilities"

[[controls]]
id = "ISO-A.5.19"
title = "Information security in supplier relationships"
family = "Organisational Controls"
severity = "High"
description = "Processes to manage information security risks from supplier relationships"

[[controls]]
id = "ISO-A.5.20"
title = "Addressing information security within supplier agreements"
family = "Organisational Controls"
severity = "High"
description = "Security requirements established and agreed with each supplier"

[[controls]]
id = "ISO-A.5.21"
title = "Managing information security in the ICT supply chain"
family = "Organisational Controls"
severity = "High"
description = "Processes to manage information security risks in ICT supply chain"

[[controls]]
id = "ISO-A.5.22"
title = "Monitoring, review and change management of supplier services"
family = "Organisational Controls"
severity = "Moderate"
description = "Regular monitoring, review and managing changes of supplier security practices"

[[controls]]
id = "ISO-A.5.23"
title = "Information security for use of cloud services"
family = "Organisational Controls"
severity = "High"
description = "Processes for secure acquisition, use and management of cloud services"

[[controls]]
id = "ISO-A.5.24"
title = "Information security incident management planning and preparation"
family = "Organisational Controls"
severity = "High"
description = "Planning and preparing for information security incidents"

[[controls]]
id = "ISO-A.5.25"
title = "Assessment and decision on information security events"
family = "Organisational Controls"
severity = "High"
description = "Assessing information security events and deciding classification as incidents"

[[controls]]
id = "ISO-A.5.26"
title = "Response to information security incidents"
family = "Organisational Controls"
severity = "High"
description = "Responding to information security incidents in accordance with procedures"

[[controls]]
id = "ISO-A.5.27"
title = "Learning from information security incidents"
family = "Organisational Controls"
severity = "Moderate"
description = "Knowledge gained from incidents used to strengthen controls"

[[controls]]
id = "ISO-A.5.28"
title = "Collection of evidence"
family = "Organisational Controls"
severity = "Moderate"
description = "Procedures for identification, collection, acquisition and preservation of evidence"

[[controls]]
id = "ISO-A.5.35"
title = "Independent review of information security"
family = "Organisational Controls"
severity = "Moderate"
description = "Independent review of the organisation's approach to managing information security"

[[controls]]
id = "ISO-A.5.36"
title = "Compliance with policies, rules and standards for information security"
family = "Organisational Controls"
severity = "Moderate"
description = "Compliance with established policies, rules and standards verified regularly"

[[controls]]
id = "ISO-A.5.37"
title = "Documented operating procedures"
family = "Organisational Controls"
severity = "Low"
description = "Operating procedures for information processing facilities documented and available"

[[controls]]
id = "ISO-A.8.1"
title = "User endpoint devices"
family = "Technology Controls"
severity = "Moderate"
description = "Information stored on, processed by or accessible via user endpoint devices protected"

[[controls]]
id = "ISO-A.8.7"
title = "Protection against malware"
family = "Technology Controls"
severity = "High"
description = "Protection against malware implemented and supported by user awareness"

[[controls]]
id = "ISO-A.8.8"
title = "Management of technical vulnerabilities"
family = "Technology Controls"
severity = "High"
description = "Information about technical vulnerabilities obtained, exposure evaluated, and measures taken"

[[controls]]
id = "ISO-A.8.9"
title = "Configuration management"
family = "Technology Controls"
severity = "Moderate"
description = "Configurations including security configurations established, documented and maintained"

[[controls]]
id = "ISO-A.8.12"
title = "Data leakage prevention"
family = "Technology Controls"
severity = "High"
description = "Data leakage prevention measures applied to systems, networks and other devices"

[[controls]]
id = "ISO-A.8.15"
title = "Logging"
family = "Technology Controls"
severity = "High"
description = "Logs that record activities, exceptions, faults and other relevant events produced and retained"

[[controls]]
id = "ISO-A.8.16"
title = "Monitoring activities"
family = "Technology Controls"
severity = "High"
description = "Networks, systems and applications monitored for anomalous behaviour"

[[controls]]
id = "ISO-A.8.20"
title = "Networks security"
family = "Technology Controls"
severity = "High"
description = "Networks and network devices secured, managed and controlled"

[[controls]]
id = "ISO-A.8.22"
title = "Segregation of networks"
family = "Technology Controls"
severity = "Moderate"
description = "Groups of information services, users and information systems segregated"

[[controls]]
id = "ISO-A.8.24"
title = "Use of cryptography"
family = "Technology Controls"
severity = "High"
description = "Rules for effective use of cryptography including key management defined and implemented"

[[controls]]
id = "ISO-A.8.25"
title = "Secure development life cycle"
family = "Technology Controls"
severity = "High"
description = "Rules for secure development of software and systems established and applied"

[[controls]]
id = "ISO-A.8.28"
title = "Secure coding"
family = "Technology Controls"
severity = "High"
description = "Secure coding principles applied to software development"

[[controls]]
id = "ISO-A.8.29"
title = "Security testing in development and acceptance"
family = "Technology Controls"
severity = "High"
description = "Security testing processes defined and implemented in the development life cycle"

[[controls]]
id = "ISO-A.8.32"
title = "Change management"
family = "Technology Controls"
severity = "Moderate"
description = "Changes to information processing facilities and information systems controlled"

[[controls]]
id = "ISO-A.8.33"
title = "Test information"
family = "Technology Controls"
severity = "Moderate"
description = "Test information selected, protected and managed appropriately"

[[controls]]
id = "ISO-A.8.34"
title = "Protection of information systems during audit testing"
family = "Technology Controls"
severity = "Moderate"
description = "Audit tests and other assurance activities involving assessment of operational systems planned and agreed"
