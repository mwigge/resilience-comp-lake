[workspace]
resolver = "2"
members = [
    "comp-lake-core",
    "comp-lake-harvesters",
    "comp-lake-storage",
    "comp-lake-api",
    "comp-lake-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/mwigge/resilience-comp-lake"
description = "Compliance data lake for resilience testing — framework harvesting, cross-framework scoring, DuckDB storage"
keywords = ["compliance", "resilience", "dora", "nist", "duckdb"]
categories = ["command-line-utilities", "development-tools::testing"]

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# DuckDB + Arrow + Parquet
duckdb = { version = "1.10501", features = ["bundled", "appender-arrow", "vtab-arrow"] }
arrow = { version = "58", features = ["json", "ipc", "ffi"] }
parquet = { version = "58", features = ["arrow", "snap", "zstd"] }

# HTTP (harvesters + API)
reqwest = { version = "0.12", features = ["json"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# MCP
rust-mcp-sdk = "0.9"

# OpenTelemetry
opentelemetry = { version = "0.31", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.31", features = ["trace", "metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "trace", "metrics"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt"] }
tracing-opentelemetry = "0.32"

# Collections
indexmap = { version = "2", features = ["serde"] }

# Temporary files (dev/test)
tempfile = "3"

# Speed up dev builds for heavy C/C++ dependencies (DuckDB, Arrow, Parquet).
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
pedantic = "warn"
